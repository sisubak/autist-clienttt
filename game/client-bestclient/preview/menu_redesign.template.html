<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>peekgg — redesign prototype</title>
<style>
  @font-face { font-family: "PeekggFace"; src: url(data:font/otf;base64,__ACTAY__) format("opentype"); }
  @font-face { font-family: "PeekggIcons"; src: url(data:font/otf;base64,__ICONS__) format("opentype"); }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #1b1b1e;
    font-family: "PeekggFace", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  :root {
    --page: #1b1b1e;
    --bezel: #46464c;
    --bezel-hi: #5a5a61;
    --surface: #333338;
    --panel: #53535a;
    --panel-2: #5c5c64;
    --panel-hi: #b6b6bd;
    --ink: #e6e6ea;
    --ink-mid: #c2c2c9;
    --ink-dim: #a7a7b1;
    --ink-inv: #2a2a2e;
    --grip: #a5a5af;
    --track: rgba(255, 255, 255, .17);
    --track-hi: rgba(255, 255, 255, .34);
    --hair: rgba(255, 255, 255, .07);
    --acc: #d7d7dd;
    --r-xl: 46px;
    --r-l: 30px;
    --r-m: 26px;
    --r-s: 18px;
  }

  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.06), transparent 60%),
      radial-gradient(100% 100% at 50% 120%, rgba(0,0,0,.55), transparent 70%),
      var(--page);
    z-index: 0;
  }

  body::after {
    content: "";
    position: fixed; inset: 0;
    opacity: .30; z-index: 1; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='0.55'/></svg>");
    mix-blend-mode: overlay;
  }

  #viewport { position: fixed; inset: 0; display: grid; place-items: center; z-index: 2; }

  #stage {
    position: relative;
    width: 1120px; height: 720px;
    transform-origin: center center;
    user-select: none;
    -webkit-user-select: none;
  }

  .bezel {
    position: absolute; inset: 0;
    border-radius: 38px;
    background: linear-gradient(180deg, var(--bezel-hi), var(--bezel));
    box-shadow:
      0 40px 90px rgba(0, 0, 0, .55),
      0 10px 30px rgba(0, 0, 0, .35),
      inset 0 1px 0 rgba(255, 255, 255, .16),
      inset 0 -1px 0 rgba(0, 0, 0, .30);
  }

  .surface {
    position: absolute; inset: 12px;
    border-radius: 28px;
    background:
      radial-gradient(120% 100% at 40% 0%, rgba(255, 255, 255, .045), transparent 65%),
      var(--surface);
    box-shadow:
      inset 0 2px 10px rgba(0, 0, 0, .38),
      inset 0 0 0 1px rgba(0, 0, 0, .22);
  }

  .chrome { position: absolute; z-index: 5; }

  .brand {
    left: 30px; top: 30px; width: 48px; height: 48px;
    border-radius: 50%;
    background: linear-gradient(180deg, #6c6c74, #55555c);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .22),
      0 6px 16px rgba(0, 0, 0, .35);
    display: grid; place-items: center;
    cursor: pointer;
    transition: transform .35s cubic-bezier(.2, 1.6, .4, 1), box-shadow .3s;
  }
  .brand:hover { transform: translateY(-2px) scale(1.03); }
  .brand:active { transform: scale(.94); }
  .brand svg { width: 20px; height: 20px; fill: var(--ink); opacity: .92; }

  .rail {
    left: 30px; top: 102px; width: 58px; height: 576px;
    border-radius: 29px;
    background: linear-gradient(180deg, #54545b, #4a4a51);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .14),
      inset 0 0 0 1px rgba(0, 0, 0, .16),
      0 10px 26px rgba(0, 0, 0, .30);
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 0;
  }

  .rail-items {
    flex: 1 1 auto;
    display: flex; flex-direction: column; align-items: center;
    justify-content: space-evenly;
    width: 100%;
  }
  .rail-item {
    width: 34px; height: 34px;
    border-radius: 11px;
    display: grid; place-items: center;
    cursor: pointer;
    position: relative;
    transition: background .25s, transform .35s cubic-bezier(.2, 1.6, .4, 1);
  }
  .rail-item span {
    width: 9px; height: 9px;
    border-radius: 3px;
    background: var(--grip);
    opacity: .55;
    transition: all .3s cubic-bezier(.2, 1.6, .4, 1);
  }
  .rail-item:hover { background: rgba(255, 255, 255, .07); transform: translateY(-1px); }
  .rail-item:hover span { opacity: .9; }
  .rail-item.on { background: rgba(255, 255, 255, .12); }
  .rail-item.on span {
    width: 13px; height: 13px; border-radius: 4px;
    background: var(--acc);
    opacity: 1;
    box-shadow: 0 0 0 3px rgba(255, 255, 255, .10);
  }

  .rail-bottom {
    margin-top: auto;
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(180deg, #6d6d76, #55555c);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .20), 0 4px 12px rgba(0, 0, 0, .3);
    display: grid; place-items: center;
    cursor: pointer;
    transition: transform .35s cubic-bezier(.2, 1.6, .4, 1);
  }
  .rail-bottom:hover { transform: rotate(45deg) scale(1.05); }
  .rail-bottom svg { width: 17px; height: 17px; fill: var(--ink); opacity: .85; }

  .diamond {
    left: 50%; top: 684px;
    width: 14px; height: 14px;
    margin-left: -7px;
    border-radius: 4px;
    background: rgba(255, 255, 255, .30);
    transform: rotate(45deg);
    cursor: pointer;
    transition: transform .4s cubic-bezier(.2, 1.7, .4, 1), background .3s;
  }
  .diamond:hover { background: rgba(255, 255, 255, .55); transform: rotate(135deg) scale(1.15); }
  .diamond:active { transform: rotate(135deg) scale(.9); }

  .ghost {
    position: absolute;
    border-radius: var(--r-l);
    border: 2px dashed rgba(255, 255, 255, .10);
    opacity: 0;
    transition: opacity .3s, border-color .2s, background .2s;
    pointer-events: none;
    z-index: 3;
  }
  .ghost.show { opacity: 1; }
  #ghosts.off .ghost { opacity: 0 !important; }
  .ghost.hot {
    z-index: 998;
    border-color: rgba(255, 255, 255, .55);
    background: rgba(255, 255, 255, .04);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .10);
  }

  .panel {
    position: absolute;
    will-change: transform;
    transform-origin: 50% 50%;
    z-index: 10;
    cursor: grab;
    touch-action: none;
  }
  .panel.dragging { cursor: grabbing; z-index: 999; }

  .panel .clip {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    background: linear-gradient(180deg, var(--panel-2-a, var(--panel-2)), var(--panel-a, var(--panel)));
    backdrop-filter: blur(var(--blur, 0px)) saturate(var(--sat, 1.06));
    -webkit-backdrop-filter: blur(var(--blur, 0px)) saturate(var(--sat, 1.06));
    box-shadow:
      0 18px 34px rgba(0, 0, 0, .30),
      0 4px 10px rgba(0, 0, 0, .22),
      inset 0 1px 0 rgba(255, 255, 255, .10),
      inset 0 0 0 1px rgba(0, 0, 0, .12);
    transition: box-shadow .35s, transform .4s cubic-bezier(.2, 1.6, .4, 1), background .3s;
  }
  .panel:hover .clip { transform: translateY(-1.5px); }
  .panel.dragging:hover .clip { transform: none; }
  .panel.dragging .clip,
  .panel.lifted .clip {
    box-shadow:
      0 40px 70px rgba(0, 0, 0, .50),
      0 12px 22px rgba(0, 0, 0, .30),
      inset 0 1px 0 rgba(255, 255, 255, .16),
      inset 0 0 0 1px rgba(0, 0, 0, .12);
  }
  .panel .clip::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0; height: 26px;
    background: linear-gradient(to top, rgba(83, 83, 90, .95), rgba(83, 83, 90, 0));
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s;
  }
  .panel.fade .clip::after { opacity: 1; }
  .panel.hi .clip::after {
    background: linear-gradient(to top, rgba(182, 182, 189, .95), rgba(182, 182, 189, 0));
  }
  .panel.main .clip::after { display: none; }
  .panel.hi .clip {
    background: linear-gradient(180deg, var(--hi-2-a, #c0c0c7), var(--hi-a, var(--panel-hi)));
  }
  .panel.hi { --acc: var(--acc-dark, #34343a); --track: rgba(0, 0, 0, .16); --track-hi: rgba(0, 0, 0, .30); }
  .panel.hi .tg.on i { background: #ecedf1; }
  .panel.hi .sl .kn { box-shadow: 0 2px 6px rgba(0, 0, 0, .30), inset 0 0 0 1px rgba(255, 255, 255, .10); }
  .panel.hi { color: var(--ink-inv); }

  .panel-head {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 20px 0;
  }
  .panel-title {
    min-width: 0;
    font-size: 11px; letter-spacing: .10em; text-transform: uppercase;
    color: var(--ink-mid);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .panel.hi .panel-title { color: rgba(35, 35, 40, .78); }
  .panel-sub {
    font-size: 9px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-dim);
  }

  .grip {
    position: absolute; left: 9px; top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 3px;
    opacity: .55;
    transition: opacity .25s;
  }
  .panel:hover .grip, .panel.dragging .grip { opacity: 1; }
  .grip i {
    display: block; width: 4px; height: 4px; border-radius: 2px;
    background: var(--grip);
  }
  .panel.hi .grip i { background: rgba(40, 40, 46, .55); }


  .rows {
    display: flex; flex-direction: column; gap: 5px;
    padding: 8px 16px 16px;
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; scrollbar-width: none;
  }
  .rows::-webkit-scrollbar { width: 0; height: 0; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    height: 23px; flex: 0 0 23px;
    padding: 0 9px 0 12px;
    border-radius: 13px;
    background: rgba(0, 0, 0, .14);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
    transition: background .28s, transform .34s cubic-bezier(.2, 1.6, .4, 1), opacity .28s;
  }
  .row:hover { background: rgba(255, 255, 255, .06); transform: translateX(3px); }
  .panel.hi .row:hover { background: rgba(0, 0, 0, .16); }
  .row-label {
    flex: 1 1 auto; min-width: 0;
    font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-mid);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .panel.hi .row { background: rgba(0, 0, 0, .10); }
  .panel.hi .row-label { color: rgba(35, 35, 40, .80); }

  .no-drag { cursor: pointer; }

  .resize {
    position: absolute; right: 4px; bottom: 4px;
    width: 24px; height: 24px;
    display: grid; place-items: center;
    opacity: 0;
    cursor: nwse-resize;
    transition: opacity .25s;
  }
  .resize::after {
    content: "";
    width: 7px; height: 7px;
    margin: 0 0 3px 3px;
    border-right: 2px solid rgba(255, 255, 255, .45);
    border-bottom: 2px solid rgba(255, 255, 255, .45);
    border-bottom-right-radius: 3px;
  }
  .panel:hover .resize { opacity: 1; }
  .panel.hi .resize::after { border-color: rgba(40, 40, 46, .55); }

  .tg {
    position: relative;
    width: 34px; height: 18px;
    border-radius: 9px;
    background: var(--track);
    flex: 0 0 auto;
    transition: background .3s;
  }
  .tg.on { background: var(--acc); }
  .tg i {
    position: absolute; top: 3px; left: 3px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--ink);
    transition: transform .45s cubic-bezier(.2, 1.9, .35, 1), background .3s;
  }
  .tg.on i { transform: translateX(16px); background: #3a3a40; }

  .sl {
    position: relative;
    width: 96px; height: 18px;
    flex: 0 1 96px; min-width: 46px;
  }
  .sl .trk {
    position: absolute; left: 0; right: 0; top: 7px; height: 4px;
    border-radius: 2px;
    background: var(--track);
  }
  .sl .fil {
    position: absolute; left: 0; top: 7px; height: 4px;
    border-radius: 2px;
    background: var(--acc);
    width: 50%;
  }
  .sl .kn {
    position: absolute; top: 2px; left: 50%;
    width: 14px; height: 14px; margin-left: -7px;
    border-radius: 50%;
    background: var(--acc);
    box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
  }

  .pill-val {
    max-width: 56%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 9.5px; letter-spacing: .08em;
    color: var(--ink);
    padding: 3px 9px;
    border-radius: 9px;
    background: rgba(255, 255, 255, .10);
    flex: 0 0 auto;
  }
  .panel.hi .pill-val { background: rgba(0, 0, 0, .14); color: var(--ink-inv); }

  .segbar { position: absolute; inset: 0; display: flex; gap: 4px; padding: 7px; }
  .seg-pill {
    position: absolute; top: 7px; bottom: 7px; left: 0;
    width: 0;
    border-radius: 22px;
    background: var(--acc);
    box-shadow: 0 6px 14px rgba(0, 0, 0, .25);
    pointer-events: none;
    transition:
      transform .58s cubic-bezier(.2, 1.6, .35, 1),
      width .58s cubic-bezier(.2, 1.6, .35, 1),
      background .3s;
  }
  .seg {
    position: relative; z-index: 1;
    flex: 1 1 0;
    min-width: 0;
    border-radius: 22px;
    display: grid; place-items: center;
    padding: 0 5px;
    font-size: 8.5px; letter-spacing: .02em; text-transform: uppercase;
    color: var(--ink-dim);
    background: transparent;
    transition: color .3s, transform .4s cubic-bezier(.2, 1.7, .4, 1);
  }
  .seg span {
    max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .seg:hover { color: var(--ink-mid); }
  .seg.on { color: var(--ink-inv); }
  .seg.on:hover { color: var(--ink-inv); }

  .main-body {
    position: absolute; inset: 0;
    display: grid; place-items: center;
  }
  .main-glyph { opacity: .34; transition: transform .6s cubic-bezier(.2, 1.5, .4, 1), opacity .4s; }
  .main-glyph svg { width: var(--glyph, 132px); height: var(--glyph, 132px); fill: var(--ink); }
  .panel.main:hover .main-glyph { transform: scale(1.04); opacity: .42; }

  .main-title {
    position: absolute; left: 34px; top: 30px;
    max-width: calc(100% - 230px);
  }
  .main-title .t, .main-title .s {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .main-title .t {
    font-size: var(--title, 17px); letter-spacing: .12em; text-transform: uppercase; color: var(--ink);
  }
  .main-title .s {
    margin-top: 6px;
    font-size: 9.5px; letter-spacing: .10em; text-transform: uppercase; color: var(--ink-dim);
  }
  .main-chip {
    position: absolute; right: 30px; top: 30px;
    max-width: 42%;
    overflow: hidden; white-space: nowrap;
    display: flex; align-items: center; gap: 7px;
    padding: 7px 13px;
    border-radius: 15px;
    background: rgba(255, 255, 255, .10);
    font-size: 9px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-mid);
  }
  .main-chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); }

  .search { display: flex; align-items: center; gap: 12px; padding: 14px 18px; height: 100%; }
  .search-add {
    width: 50px; height: 50px; border-radius: 50%;
    background: var(--acc);
    display: grid; place-items: center;
    flex: 0 0 auto;
    color: var(--ink-inv);
    transition: transform .45s cubic-bezier(.2, 1.9, .35, 1);
  }
  .search-add:hover { transform: rotate(90deg) scale(1.06); }
  .search-add:active { transform: rotate(90deg) scale(.92); }
  .search-add svg { width: 18px; height: 18px; fill: currentColor; }
  .search-field:focus-within {
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .20), 0 10px 22px rgba(0, 0, 0, .28);
  }
  .search-field {
    flex: 1 1 auto; min-width: 0;
    height: 38px;
    border-radius: 19px;
    background: rgba(0, 0, 0, .14);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
    display: flex; align-items: center;
    padding: 0 16px;
  }
  .search-field input {
    width: 100%;
    user-select: text; -webkit-user-select: text;
    background: none; border: 0; outline: none;
    font-family: inherit;
    font-size: 10px; letter-spacing: .07em;
    color: var(--ink);
    cursor: text;
  }
  .search-field input::placeholder { color: var(--ink-dim); }

  .presets-body { position: absolute; inset: 0; }
  .sheets { position: absolute; left: 24px; right: 34px; bottom: 20px; height: 92px; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 76px;
    border-radius: 20px;
    background: linear-gradient(180deg, #77777f, #66666e);
    box-shadow:
      0 10px 22px rgba(0, 0, 0, .28),
      inset 0 1px 0 rgba(255, 255, 255, .14);
    display: flex; align-items: flex-end;
    padding: 12px 16px;
    font-size: 9px; letter-spacing: .10em; text-transform: uppercase;
    color: var(--ink);
    transition: transform .5s cubic-bezier(.2, 1.6, .4, 1), filter .3s;
  }
  .sheet { transform-origin: 50% 100%; }
  .sheet:nth-child(1) { transform: translate(0, 0) rotate(0deg); }
  .sheet:nth-child(2) { transform: translate(0, -15px) rotate(2.6deg) scale(.955); filter: brightness(.95); }
  .sheet:nth-child(3) { transform: translate(0, -29px) rotate(5.2deg) scale(.91); filter: brightness(.90); }
  .sheet:hover { transform: translate(0, -6px) rotate(-1deg) scale(1.01); filter: brightness(1.06); z-index: 3; }

  .preset-dot {
    position: absolute; right: 20px; top: 18px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .26);
    transition: background .3s, transform .4s cubic-bezier(.2, 1.8, .4, 1);
  }
  .preset-dot:hover { background: rgba(255, 255, 255, .6); transform: scale(1.2); }

  .set-body {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    gap: 14px;
    padding: 28px 26px 22px;
  }
  .set-head { display: flex; align-items: baseline; gap: 10px; }
  .set-title { font-size: 15px; letter-spacing: .16em; color: var(--ink); }
  .set-sub { font-size: 8.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
  .set-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; flex: 1 1 auto; min-height: 0; }
  .set-card {
    background: rgba(0, 0, 0, .16);
    border-radius: 20px;
    padding: 14px 16px 16px;
    display: flex; flex-direction: column; gap: 16px;
    min-height: 0; overflow-y: auto; scrollbar-width: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
  }
  .set-card::-webkit-scrollbar { width: 0; }
  .set-card h4 {
    margin: 0 0 4px; font-size: 9px; font-weight: 400;
    letter-spacing: .18em; text-transform: uppercase; color: var(--ink-dim);
  }
  .ctl { display: flex; align-items: center; gap: 10px; height: 40px; flex: 0 0 40px; }
  .ctl-label {
    flex: 1 1 auto; min-width: 0;
    font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-mid);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ctl-val { flex: 0 0 46px; text-align: right; font-size: 8.5px; letter-spacing: .04em; color: var(--ink-dim); }
  .ctl .sl { flex: 0 1 150px; min-width: 60px; }
  .swatches { display: flex; gap: 6px; flex: 0 0 auto; margin-left: auto; margin-right: 56px; }
  .swatch {
    width: 17px; height: 17px; border-radius: 50%; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .22), 0 2px 5px rgba(0, 0, 0, .28);
    transition: transform .34s cubic-bezier(.2, 1.7, .4, 1), box-shadow .25s;
  }
  .swatch:hover { transform: scale(1.16); }
  .swatch.on { box-shadow: 0 0 0 2px rgba(255, 255, 255, .55), 0 3px 8px rgba(0, 0, 0, .32); }
  .set-foot {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    background: rgba(0, 0, 0, .12); border-radius: 18px; padding: 9px 12px;
    flex: 0 0 auto;
  }
  .set-foot .ctl { flex: 0 0 auto; gap: 9px; height: 24px; }
  .set-foot .ctl-label { flex: 0 0 auto; }
  .set-btn {
    font: inherit; font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink); background: rgba(255, 255, 255, .09);
    border: 0; border-radius: 11px; padding: 8px 11px; cursor: pointer;
    transition: background .25s, transform .32s cubic-bezier(.2, 1.7, .4, 1);
  }
  .set-btn:hover { background: rgba(255, 255, 255, .17); transform: translateY(-1px); }
  .set-btn:active { transform: scale(.96); }
  .set-btn.accent { background: var(--acc); color: var(--ink-inv); }
