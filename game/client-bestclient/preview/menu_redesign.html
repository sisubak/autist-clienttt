const PANEL_DATA = [
  { id: "main", slot: "main", kind: "main", title: "АУРА ЦЕЛИ", sub: "визуал · эффект" },
  { id: "bar", slot: "bar", kind: "segbar", segs: ["ВИЗУАЛ", "АКСЕССУАРЫ", "НАСТРОЙКИ"], active: 0 },
  { id: "card1", slot: "card1", kind: "module", title: "СВЕЧЕНИЕ ЛАЗЕРА", rows: [{ l: "Включить", t: "tg", on: false }, { l: "Сила", t: "sl", v: .5 }] },
  { id: "card2", slot: "card2", kind: "module", title: "JELLY TEE", rows: [{ l: "Включить", t: "tg", on: true }, { l: "Сила", t: "sl", v: .82 }] },
  { id: "card3", slot: "card3", kind: "module", hi: true, title: "ПОГОДА", rows: [{ l: "Включить", t: "tg", on: true }, { l: "Тип", t: "val", v: "СНЕГ" }] },
  {
    id: "rows", slot: "rows", kind: "list", title: "БЫСТРЫЕ", rows: [
      { l: "Фриз-бары", t: "tg", on: true },
      { l: "Хук-коллизия", t: "sl", v: .66 },
      { l: "Прозрачность", t: "sl", v: .4 },
      { l: "Масштаб колеса", t: "sl", v: 1 },
      { l: "Подтверждение", t: "tg", on: false },
    ]
  },
  { id: "search", slot: "search", kind: "search" },
  { id: "presets", slot: "presets", kind: "presets", title: "ПРЕСЕТЫ", sheets: ["DEFAULT", "AIM", "VISUAL"] },
];

const panelById = new Map();
const panelEls = new Map();
const ghostsEl = document.getElementById("ghosts");
const panelsEl = document.getElementById("panels");

let zTop = 10;

function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
}

function rowNode(row) {
  const r = el("div", "row");
  r.append(el("div", "row-label", row.l));
  if (row.t === "tg") {
    const tg = el("div", "tg no-drag" + (row.on ? " on" : ""), "<i></i>");
    tg.addEventListener("pointerdown", (e) => e.stopPropagation());
    tg.addEventListener("click", (e) => { e.stopPropagation(); tg.classList.toggle("on"); });
    r.append(tg);
  } else if (row.t === "sl") {
    const sl = el("div", "sl no-drag");
    sl.innerHTML = '<div class="trk"></div><div class="fil"></div><div class="kn"></div>';
    const fil = sl.querySelector(".fil");
    const kn = sl.querySelector(".kn");
    const set = (v) => {
      const k = Math.max(0, Math.min(1, v));
      const pos = "calc(7px + (100% - 14px) * " + k + ")";
      fil.style.width = pos;
      kn.style.left = pos;
    };
    set(row.v);
    let active = false;
    const move = (e) => {
      const b = sl.getBoundingClientRect();
      set(Math.max(0, Math.min(1, (e.clientX - b.left) / b.width)));
    };
    sl.addEventListener("pointerdown", (e) => { e.stopPropagation(); sl.setPointerCapture(e.pointerId); active = true; move(e); });
    sl.addEventListener("pointermove", (e) => { if (active) move(e); });
    sl.addEventListener("pointerup", () => { active = false; });
    r.append(sl);
  } else {
    r.append(el("div", "pill-val", row.v));
  }
  return r;
}

function buildPanel(data) {
  const slot = SLOTS[data.slot];
  const p = {
    id: data.id,
    slot: data.slot,
    w: slot.w,
    h: slot.h,
    r: slot.r,
    x: slot.x, y: slot.y,
    tx: slot.x, ty: slot.y,
    vx: 0, vy: 0,
    sc: 1, tsc: 1, vsc: 0,
    rot: 0, vrot: 0,
    k: 190, c: 16.5,
    dragging: false,
  };

  const node = el("div", "panel" + (data.kind === "main" ? " main" : "") + (data.hi ? " hi" : ""));
  node.style.width = slot.w + "px";
  node.style.height = slot.h + "px";
  node.dataset.id = data.id;

  const clip = el("div", "clip");
  clip.style.borderRadius = slot.r + "px";

  if (data.kind === "segbar") {
    const bar = el("div", "segbar");
    data.segs.forEach((s, i) => {
      const seg = el("div", "seg no-drag" + (i === data.active ? " on" : ""), "<span>" + s + "</span>");
      seg.dataset.idx = i;
      bar.append(seg);
    });
    clip.append(bar);
  } else if (data.kind === "main") {
    const body = el("div", "main-body");
    body.innerHTML = '<div class="main-glyph">' + GLYPHS.aura + "</div>";
    clip.append(body);
    const t = el("div", "main-title");
    t.innerHTML = '<div class="t">' + data.title + '</div><div class="s">' + data.sub + "</div>";
    clip.append(t);
    const chip = el("div", "main-chip", "<i></i>активно");
    clip.append(chip);
  } else if (data.kind === "search") {
    const s = el("div", "search");
    const add = el("div", "search-add no-drag", '<svg viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg>');
    const field = el("div", "search-field");
    const input = el("input");
    input.className = "no-drag";
    input.placeholder = "Поиск модулей...";
    input.id = "search-input";
    field.append(input);
    s.append(add, field);
    clip.append(s);
  } else if (data.kind === "presets") {
    const body = el("div", "presets-body");
    const head = el("div", "panel-head");
    head.append(el("div", "panel-title", data.title));
    body.append(head);
    const dot = el("div", "preset-dot no-drag");
    body.append(dot);
    const sheets = el("div", "sheets");
    data.sheets.forEach((name, i) => {
      const sh = el("div", "sheet no-drag", name);
      sh.style.zIndex = 10 - i;
      sh.addEventListener("click", () => {
        sheets.querySelectorAll(".sheet").forEach((x) => x.style.zIndex = 20);
        sh.style.zIndex = 30;
        pulse(sh);
      });
      sheets.append(sh);
    });
    body.append(sheets);
    clip.append(body);
  } else {
    const head = el("div", "panel-head");
    head.append(el("div", "panel-title", data.title));
    clip.append(head);
    const rows = el("div", "rows");
    data.rows.forEach((r) => rows.append(rowNode(r)));
    clip.append(rows);
  }

  if (data.kind === "module" || data.kind === "list" || data.kind === "presets") {
    const grip = el("div", "grip", "<i></i><i></i><i></i>");
    clip.append(grip);
  }

  const rz = el("div", "resize no-drag");
  rz.addEventListener("pointerdown", (e) => onResizeDown(e, p, node));
  node.append(clip, rz);

  if (data.kind === "main") {
    node.append(el("div", "knob no-drag"));
  }

  node.addEventListener("pointerdown", (e) => onDown(e, p, node));
  node.addEventListener("dblclick", (e) => {
    if (e.target.closest(".no-drag")) return;
    sendHome(p);
  });
  panelsEl.append(node);
  node.style.zIndex = String(++zTop);

  panelById.set(p.id, p);
  panelEls.set(p.id, node);
  requestAnimationFrame(() => updateFade(p));
  return p;
}

function pulse(node) {
  node.animate(
    [{ transform: "translateY(0) scale(1)" }, { transform: "translateY(-4px) scale(1.03)" }, { transform: "translateY(0) scale(1)" }],
    { duration: 520, easing: "cubic-bezier(.2,1.6,.4,1)" }
  );
}

PANEL_DATA.forEach(buildPanel);

PANEL_DATA.forEach((d, i) => {
  const p = panelById.get(d.id);
  const cx = DESIGN_W / 2 - p.w / 2;
  const cy = DESIGN_H / 2 - p.h / 2;
  p.x = p.tx + (cx - p.tx) * 0.42;
  p.y = p.ty + (cy - p.ty) * 0.42;
  p.sc = 0.90;
  p.vsc = 0.6;
  p.k = 112; p.c = 12.5;
  setTimeout(() => { p.tsc = 1; }, 80 + i * 55);
  setTimeout(() => { p.k = 190; p.c = 16.5; }, 900);
});

const ghostBySlot = new Map();
Object.keys(SLOTS).forEach((key) => {
  const s = SLOTS[key];
  const g = el("div", "ghost");
  g.style.left = s.x + "px";
  g.style.top = s.y + "px";
  g.style.width = s.w + "px";
  g.style.height = s.h + "px";
  g.style.borderRadius = s.r + "px";
  ghostsEl.append(g);
  ghostBySlot.set(key, g);
});

function occupantOf(slotKey) {
  for (const p of panelById.values()) if (p.slot === slotKey) return p;
  return null;
}

function refreshGhosts() {
  ghostBySlot.forEach((g, key) => {
    const occ = occupantOf(key);
    g.classList.toggle("show", !occ);
  });
}

refreshGhosts();

const stage = document.getElementById("stage");
const viewport = document.getElementById("viewport");
let stageScale = 1;
let stageRect = stage.getBoundingClientRect();

function fitStage() {
  const pad = 84;
  const padBottom = 52;
  const k = Math.min(
    (window.innerWidth - pad) / DESIGN_W,
    (window.innerHeight - pad - padBottom) / DESIGN_H
  );
  stageScale = Math.max(.35, Math.min(1.6, k));
  stage.style.transform = "scale(" + stageScale + ")";
  stageRect = stage.getBoundingClientRect();
}
window.addEventListener("resize", fitStage);
fitStage();

function toStage(clientX, clientY) {
  return {
    x: (clientX - stageRect.left) / stageScale,
    y: (clientY - stageRect.top) / stageScale,
  };
}

let drag = null;
let resizing = null;

function onResizeDown(e, p, node) {
  if (e.button !== 0) return;
  e.stopPropagation();
  const pt = toStage(e.clientX, e.clientY);
  p.slot = null;
  p.k = 900; p.c = 62;
  p.tsc = 1.02;
  refreshGhosts();
  resizing = { p: p, node: node, startX: pt.x, startY: pt.y, w0: p.w, h0: p.h, id: e.pointerId };
  node.setPointerCapture(e.pointerId);
  window.addEventListener("pointermove", onResizeMove);
  window.addEventListener("pointerup", onResizeUp);
}

function onResizeMove(e) {
  if (!resizing) return;
  const pt = toStage(e.clientX, e.clientY);
  const p = resizing.p;
  p.w = Math.max(170, Math.min(DESIGN_W - p.x - 12, resizing.w0 + (pt.x - resizing.startX)));
  p.h = Math.max(80, Math.min(DESIGN_H - p.y - 12, resizing.h0 + (pt.y - resizing.startY)));
  applySize(p);
}

function onResizeUp() {
  if (!resizing) return;
  const p = resizing.p;
  p.k = 190; p.c = 16.5;
  p.tsc = 1;
  p.vsc = -0.04;
  resizing = null;
  window.removeEventListener("pointermove", onResizeMove);
  window.removeEventListener("pointerup", onResizeUp);
}

function onDown(e, p, node) {
  if (e.button !== 0) return;
  p.z = ++zTop;
  node.style.zIndex = String(p.z);
  if (e.target.closest(".no-drag")) return;
  const pt = toStage(e.clientX, e.clientY);
  p.dragging = true;
  p.z = ++zTop;
  node.style.zIndex = String(p.z);
  node.classList.add("dragging");
  p.tsc = 1.035;
  p.k = 620; p.c = 52;
  p.grabX = pt.x - p.x;
  p.grabY = pt.y - p.y;
  node.style.transformOrigin = p.grabX.toFixed(1) + "px " + p.grabY.toFixed(1) + "px";
  p.fromSlot = p.slot;
  p.slot = null;
  refreshGhosts();
  p.tx = p.x;
  p.ty = p.y;
  drag = { p: p, node: node, id: e.pointerId, startX: pt.x, startY: pt.y };
  node.setPointerCapture(e.pointerId);
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
}

function onMove(e) {
  if (!drag) return;
  const pt = toStage(e.clientX, e.clientY);
  const p = drag.p;
  p.tx = pt.x - p.grabX;
  p.ty = pt.y - p.grabY;
  const vx = pt.x - drag.startX, vy = pt.y - drag.startY;
  p.vrot = Math.max(-0.035, Math.min(0.035, vx * 0.00035));
  drag.startX = pt.x; drag.startY = pt.y;
  highlightSlot(findSlotAt(pt.x, pt.y, p));
}

function sizeFits(p, s) {
  const a = p.w * p.h, b = s.w * s.h;
  const area = Math.max(a / b, b / a);
  const ar = Math.max((p.w / p.h) / (s.w / s.h), (s.w / s.h) / (p.w / p.h));
  return area <= 1.9 && ar <= 1.45;
}

function findSlotAt(x, y, panel) {
  let best = null, bestD = Infinity;
  Object.keys(SLOTS).forEach((key) => {
    const s = SLOTS[key];
    const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
    const inside = x > s.x - 30 && x < s.x + s.w + 30 && y > s.y - 30 && y < s.y + s.h + 30;
    if (!inside) return;
    const d = Math.hypot(x - cx, y - cy);
    if (d < bestD) { bestD = d; best = key; }
  });
  if (best && panel && !sizeFits(panel, SLOTS[best])) return null;
  return best;
}

function highlightSlot(key) {
  ghostBySlot.forEach((g, k) => {
    g.classList.toggle("hot", k === key);
    g.classList.toggle("show", !occupantOf(k) || k === key);
  });
}

function onUp() {
  if (!drag) return;
  const p = drag.p;
  const node = drag.node;
  p.dragging = false;
  p.k = 190; p.c = 16.5;
  p.tsc = 1;
  p.vrot = 0;
  node.classList.remove("dragging");
  window.removeEventListener("pointermove", onMove);
  window.removeEventListener("pointerup", onUp);
  window.removeEventListener("pointercancel", onUp);

  const target = findSlotAt(p.x + p.w / 2, p.y + p.h / 2, p) || findSlotAt(p.tx + p.w / 2, p.ty + p.h / 2, p);
  if (target) {
    const occ = occupantOf(target);
    const home = p.fromSlot;
    if (occ && occ !== p) {
      if (home && home !== target) {
        setSlot(occ, home);
        occ.vx += 40; occ.vy -= 30;
      } else {
        eject(occ);
      }
    }
    setSlot(p, target);
  } else {
    p.slot = null;
    p.tx = Math.max(20, Math.min(DESIGN_W - p.w - 20, p.tx));
    p.ty = Math.max(20, Math.min(DESIGN_H - p.h - 20, p.ty));
    p.vx += (p.x - p.tx) * 2.5;
    p.vy += (p.y - p.ty) * 2.5;
  }
  p.vsc = -0.06;
  drag = null;
  ghostBySlot.forEach((g) => g.classList.remove("hot"));
  refreshGhosts();
}

function eject(occ) {
  occ.slot = null;
  occ.tx = Math.max(20, Math.min(DESIGN_W - occ.w - 20, occ.tx + 46));
  occ.ty = Math.max(20, Math.min(DESIGN_H - occ.h - 20, occ.ty + 56));
  occ.vx += 80; occ.vy -= 60;
  occ.z = ++zTop;
  panelEls.get(occ.id).style.zIndex = String(occ.z);
}

function setSlot(p, slotKey) {
  const s = SLOTS[slotKey];
  p.slot = slotKey;
  p.w = s.w; p.h = s.h; p.r = s.r;
  p.tx = s.x; p.ty = s.y;
  p.k = 190; p.c = 16.5;
  applySize(p);
}

function dockTo(p, slotKey) {
  const occ = occupantOf(slotKey);
  const home = p.slot;
  if (occ && occ !== p) {
    if (home && home !== slotKey) {
      setSlot(occ, home);
      occ.vx += 40; occ.vy -= 30;
    } else {
      eject(occ);
    }
  }
  setSlot(p, slotKey);
  p.vx += 30; p.vy -= 20;
  refreshGhosts();
  updateFade(p);
}

function sendHome(p) {
  const def = PANEL_DATA.find((d) => d.id === p.id);
  if (!def) return;
  dockTo(p, def.slot);
  p.vsc = 0.05;
}

function updateFade(p) {
  const node = panelEls.get(p.id);
  const clip = node.querySelector(".clip");
  const sc = clip.querySelector(".rows");
  const over = sc
    ? sc.scrollHeight > sc.clientHeight + 2
    : clip.scrollHeight > clip.clientHeight + 2;
  node.classList.toggle("fade", over);
}

function applySize(p) {
  const node = panelEls.get(p.id);
  node.style.width = p.w + "px";
  node.style.height = p.h + "px";
  const clip = node.querySelector(".clip");
  clip.style.borderRadius = p.r + "px";
  if (p.id === "main") {
    const g = Math.round(Math.max(54, Math.min(132, Math.min(p.h * 0.28, p.w * 0.24))));
    clip.style.setProperty("--glyph", g + "px");
    clip.style.setProperty("--title", Math.round(Math.max(12, Math.min(17, p.w * 0.026))) + "px");
  }
  updateFade(p);
}

function bindAll() {
  PANEL_DATA.forEach((d) => {
    const p = panelById.get(d.id);
    const s = SLOTS[d.slot];
    p.slot = d.slot;
    p.fromSlot = d.slot;
    p.w = s.w; p.h = s.h; p.r = s.r;
    p.tx = s.x; p.ty = s.y;
    p.k = 190; p.c = 16.5;
    p.vx += 60; p.vy -= 40;
    applySize(p);
  });
  refreshGhosts();
}

document.getElementById("diamond").addEventListener("click", bindAll);
document.querySelector(".brand").addEventListener("click", bindAll);

function buildRail() {
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  const list = el("div", "rail-items");
  RAIL_ITEMS.forEach((item, i) => {
    const it = el("div", "rail-item no-drag" + (i === 0 ? " on" : ""), "<span></span>");
    it.title = item.title;
    it.addEventListener("click", () => {
      list.querySelectorAll(".rail-item").forEach((x) => x.classList.remove("on"));
      it.classList.add("on");
      setMain(item);
      pulse(it);
    });
    list.append(it);
  });
  rail.append(list);
  const bottom = el("div", "rail-bottom no-drag", '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.2 12c0-.4 0-.8-.1-1.2l2-1.5-2-3.4-2.3.9c-.6-.5-1.3-1-2-1.3L14.4 3H9.6l-.4 2.5c-.7.3-1.4.8-2 1.3l-2.3-.9-2 3.4 2 1.5c-.1.4-.1.8-.1 1.2s0 .8.1 1.2l-2 1.5 2 3.4 2.3-.9c.6.5 1.3 1 2 1.3l.4 2.5h4.8l.4-2.5c.7-.3 1.4-.8 2-1.3l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>');
  bottom.title = "настройки";
  rail.append(bottom);
}

let currentItem = RAIL_ITEMS[0];

function setMain(item) {
  currentItem = item;
  const node = panelEls.get("main");
  const t = node.querySelector(".main-title .t");
  const s = node.querySelector(".main-title .s");
  const g = node.querySelector(".main-glyph");
  t.textContent = item.title;
  s.textContent = item.sub;
  g.innerHTML = GLYPHS[item.key] || GLYPHS.aura;

buildRail();

document.querySelectorAll(".seg").forEach((seg) => {
  seg.addEventListener("click", () => {
    const bar = seg.parentElement;
    bar.querySelectorAll(".seg").forEach((x) => x.classList.remove("on"));
    seg.classList.add("on");

  });
});

const searchInput = document.getElementById("search-input");
searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  const rowsNode = panelEls.get("rows").querySelectorAll(".row");
  rowsNode.forEach((r) => {
    const label = r.querySelector(".row-label").textContent.toLowerCase();
    r.style.opacity = q === "" || label.includes(q) ? "1" : ".3";
  });
});

let last = 0;
function tick(ts) {
  const now = ts / 1000;
  const dt = Math.min(0.05, last ? now - last : 1 / 60);
  last = now;

  panelById.forEach((p) => {
    const ax = (p.tx - p.x) * p.k - p.vx * p.c;
    const ay = (p.ty - p.y) * p.k - p.vy * p.c;
    p.vx += ax * dt;
    p.vy += ay * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    const as = (p.tsc - p.sc) * 320 - p.vsc * 26;
    p.vsc += as * dt;
    p.sc += p.vsc * dt;

    const targetRot = p.dragging ? p.vrot * 0.6 : 0;
    p.rot += (targetRot - p.rot) * Math.min(1, dt * 12);

    const node = panelEls.get(p.id);
    node.style.transform =
      "translate3d(" + p.x.toFixed(2) + "px," + p.y.toFixed(2) + "px,0) rotate(" + (p.rot * 57.2958).toFixed(2) + "deg) scale(" + p.sc.toFixed(4) + ")";
  });

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const hud = document.getElementById("hud");
let hudTimer = null;
function wakeHud() {
  hud.classList.add("awake");
  clearTimeout(hudTimer);
  hudTimer = setTimeout(() => hud.classList.remove("awake"), 2600);
}
wakeHud();
["pointermove", "pointerdown", "keydown"].forEach((ev) => window.addEventListener(ev, wakeHud, { passive: true }));
window.addEventListener("pointermove", (e) => {
  if (hud.matches(":hover")) hud.classList.add("awake");
});
const hAccent = document.getElementById("h-accent");
const hAccentV = document.getElementById("h-accent-v");
function applyAccent(v) {
  const root = document.documentElement;
  hAccent.value = String(v);
  if (v === 0) {
    root.style.setProperty("--acc", "#d7d7dd");
    root.style.setProperty("--acc-dark", "#34343a");
    hAccentV.textContent = "серый";
  } else {
    root.style.setProperty("--acc", "hsl(" + v + " 42% 74%)");
    root.style.setProperty("--acc-dark", "hsl(" + v + " 40% 30%)");
    hAccentV.textContent = v + "°";
  }
}
hAccent.addEventListener("input", () => applyAccent(+hAccent.value));
applyAccent(0);
document.getElementById("h-bind").addEventListener("click", bindAll);
document.getElementById("h-reset").addEventListener("click", bindAll);
window.addEventListener("keydown", (e) => {
  if (e.target && e.target.tagName === "INPUT") return;
  if (e.key === "h" || e.key === "H") hud.classList.toggle("hidden");
});
</script>
