<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>peekgg menu — preview</title>
<style>
  :root {
    --text: #f7f7ff;
    --muted: #c7c9db;
    --dim: #9496ab;
    --accent: #6152eb;

    --glass: rgba(9, 10, 14, .90);
    --panel: rgba(9, 10, 14, .84);
    --track: rgba(255, 255, 255, .14);
    --hover: rgba(255, 255, 255, .07);
    --border: rgba(255, 255, 255, .22);

    --rail-w: 46px;
    --island-gap: 14px;
    --rail-item: 32px;
    --panel-w: 700px;
    --panel-h: 398px;
    --panel-radius: 12px;
    --rail-radius: 10px;
    --header-h: 46px;
    --margin-x: 22px;

    --search-h: 28px;
    --search-gap: 10px;
    --search-max-w: 430px;

    --card-gap: 11px;
    --card-radius: 12px;
    --card-header-h: 22px;

    --row-toggle-h: 19px;
    --row-wide-h: 21px;

    --f-title: 12px;
    --f-header: 11px;
    --f-row: 12px;
    --f-value: 11px;
    --f-hint: 10px;

    --blur: 18px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 20% 15%, #1b2338 0%, transparent 60%),
      radial-gradient(900px 500px at 85% 80%, #2a1b3a 0%, transparent 55%),
      #0b0d14;
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    color: var(--text);
    display: grid;
    place-items: start center;
    padding: 40px 0;
  }

  .stage {
    display: flex;
    gap: var(--island-gap);
    align-items: flex-start;
    position: relative;
  }

  .rail {
    width: var(--rail-w);
    height: var(--panel-h);
    background: var(--glass);
    border-radius: var(--rail-radius);
    border: 1px solid var(--border);
    backdrop-filter: blur(var(--blur));
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 0;
    gap: 10px;
  }

  .rail .spacer { flex: 1; }

  .rail button {
    width: var(--rail-item);
    height: var(--rail-item);
    border-radius: 50%;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, .14);
    color: var(--muted);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: border-color .16s, color .16s, box-shadow .16s, background .16s;
  }

  .rail button:hover { border-color: rgba(255, 255, 255, .32); color: var(--text); }

  .rail button.active {
    border-color: var(--accent);
    color: var(--text);
    box-shadow: 0 0 0 4px rgba(97, 82, 235, .12);
  }

  .rail svg { width: 16px; height: 16px; fill: currentColor; }

  .panel {
    width: var(--panel-w);
    height: var(--panel-h);
    background: var(--panel);
    border-radius: var(--panel-radius);
    border: 1px solid var(--border);
    backdrop-filter: blur(var(--blur));
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    height: var(--header-h);
    display: flex;
    align-items: center;
    padding: 0 18px 0 16px;
    flex: 0 0 auto;
  }

  .header .title {
    font-size: var(--f-title);
    font-weight: 600;
    letter-spacing: .08em;
  }

  .header .close {
    margin-left: auto;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .2);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: grid;
    place-items: center;
    font-size: 11px;
    line-height: 1;
  }

  .header .close:hover { border-color: rgba(255, 255, 255, .45); color: var(--text); }

  .content {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 6px var(--margin-x) 20px;
    display: block;
    columns: 2;
    column-gap: var(--card-gap);
  }

  .content::-webkit-scrollbar { width: 8px; }
  .content::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .12); border-radius: 4px; }
  .content::-webkit-scrollbar-track { background: transparent; }

  .card {
    break-inside: avoid;
    border: 1px solid rgba(255, 255, 255, .22);
    border-radius: var(--card-radius);
    margin-bottom: var(--card-gap);
    overflow: hidden;
  }

  .card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    height: var(--card-header-h);
    margin: 6px 10px 0;
    cursor: pointer;
    user-select: none;
  }

  .card-dot {
    width: 6px; height: 6px; border-radius: 50%;
    box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 25%, transparent);
    background: currentColor;
    flex: 0 0 auto;
  }

  .card-title {
    font-size: 10.5px;
    letter-spacing: .06em;
    color: rgba(247, 247, 255, .94);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-chev {
    margin-left: auto;
    color: var(--muted);
    font-size: 9px;
    transition: transform .15s;
  }

  .card.collapsed .card-chev { transform: rotate(-90deg); }
  .card.collapsed .rows { display: none; }

  .rows { padding: 2px 8px 8px; }

  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: var(--row-toggle-h);
    border: 1px solid rgba(255, 255, 255, .10);
    border-radius: 999px;
    padding: 2px 6px 2px 9px;
    margin: 3px 2px;
    font-size: var(--f-row);
    color: var(--muted);
    transition: border-color .15s, box-shadow .15s, color .15s;
  }

  .row.on {
    color: var(--text);
    border-color: rgba(97, 82, 235, .62);
    box-shadow: 0 0 0 3px rgba(97, 82, 235, .10), 0 0 0 6px rgba(97, 82, 235, .06);
  }

  .row .label {
    flex: 1 1 auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row.wide { min-height: var(--row-wide-h); }

  .toggle {
    width: 24px; height: 11.5px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .16);
    position: relative;
    flex: 0 0 auto;
    cursor: pointer;
    transition: background .12s;
  }

  .toggle::after {
    content: "";
    position: absolute;
    top: 1.75px; left: 1.75px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .9);
    transition: left .12s;
  }

  .toggle.on { background: rgba(97, 82, 235, .92); }
  .toggle.on::after { left: 14px; }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 66px;
    height: 3px;
    border-radius: 2px;
    background: var(--track);
    outline: none;
    flex: 0 0 auto;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--text);
    box-shadow: 0 0 0 2px var(--accent);
    cursor: pointer;
  }

  .value { width: 32px; text-align: right; font-size: var(--f-value); color: var(--muted); flex: 0 0 auto; }

  select {
    background: transparent;
    color: var(--text);
    border: 1px solid rgba(255, 255, 255, .2);
    border-radius: 999px;
    font-size: var(--f-value);
    padding: 2px 8px;
    min-width: 108px;
    outline: none;
    flex: 0 0 auto;
  }

  select option { background: #0b0d14; color: var(--text); }

  .step {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid rgba(255, 255, 255, .2);
    border-radius: 999px;
    padding: 1px 8px;
    font-size: var(--f-value);
    flex: 0 0 auto;
  }

  .step button {
    background: transparent; border: 0; color: var(--muted);
    cursor: pointer; font-size: 12px; padding: 0 3px;
  }

  .step button:hover { color: var(--text); }

  .swatch {
    width: 30px; height: 14px;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, .35);
    flex: 0 0 auto;
    cursor: pointer;
  }

  .pick-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255, 255, 255, .22);
    flex: 0 0 auto;
  }

  .pick-dot.on { background: var(--accent); box-shadow: 0 0 0 2px rgba(97, 82, 235, .25); }

  .search {
    width: min(var(--search-max-w), calc(var(--panel-w) * .82));
    height: var(--search-h);
    background: rgba(3, 4, 6, .72);
    border: 1px solid rgba(255, 255, 255, .24);
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    backdrop-filter: blur(var(--blur));
    margin: var(--search-gap) auto 0;
  }

  .search:focus-within { border-color: rgba(255, 255, 255, .45); box-shadow: 0 0 0 4px rgba(97, 82, 235, .14); }

  .search svg { width: 13px; height: 13px; fill: var(--muted); flex: 0 0 auto; }

  .search input {
    flex: 1 1 auto;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--text);
    font-size: var(--f-value);
    font-family: inherit;
  }

  .search input::placeholder { color: var(--dim); }

  .footnote {
    margin: 10px auto 0;
    width: min(var(--search-max-w), calc(var(--panel-w) * .82));
    font-size: var(--f-hint);
    color: var(--dim);
    text-align: center;
  }

  .page { display: none; column-count: 2; }
  .page.active { display: block; }

  @media (min-width: 780px) {
    .page { column-count: 3; }
  }
</style>

let current = "visual";

function control(row) {
  const c = row.control;
  if (c.kind === "toggle") {
    const el = document.createElement("div");
    el.className = "toggle" + (row.on ? " on" : "");
    el.onclick = (ev) => {
      ev.stopPropagation();
      row.on = !row.on;
      el.classList.toggle("on", row.on);
      el.closest(".row").classList.toggle("on", row.on);
    };
    return el;
  }
  if (c.kind === "slider") {
    const wrap = document.createElement("div");
    wrap.style.display = "flex";
    wrap.style.alignItems = "center";
    wrap.style.gap = "4px";
    const input = document.createElement("input");
    input.type = "range";
    input.min = c.min; input.max = c.max; input.value = row.value ?? c.min;
    const out = document.createElement("span");
    out.className = "value";
    out.textContent = (row.value ?? c.min) + c.suffix;
    input.oninput = () => { row.value = +input.value; out.textContent = input.value + c.suffix; };
    wrap.append(input, out);
    return wrap;
  }
  if (c.kind === "dropdown") {
    const sel = document.createElement("select");
    c.options.forEach((o) => {
      const opt = document.createElement("option");
      opt.textContent = o;
      sel.append(opt);
    });
    sel.onclick = (ev) => ev.stopPropagation();
    return sel;
  }
  if (c.kind === "step") {
    const wrap = document.createElement("div");
    wrap.className = "step";
    const minus = document.createElement("button"); minus.textContent = "−";
    const val = document.createElement("span"); val.textContent = row.value ?? c.min;
    const plus = document.createElement("button"); plus.textContent = "+";
    minus.onclick = (ev) => { ev.stopPropagation(); row.value = Math.max(c.min, (row.value ?? c.min) - 1); val.textContent = row.value; };
    plus.onclick = (ev) => { ev.stopPropagation(); row.value = Math.min(c.max, (row.value ?? c.min) + 1); val.textContent = row.value; };
    wrap.append(minus, val, plus);
    return wrap;
  }
  if (c.kind === "color") {
    const el = document.createElement("div");
    el.className = "swatch";
    el.style.background = c.hex;
    return el;
  }
  if (c.kind === "pick") {
    const el = document.createElement("div");
    el.className = "pick-dot" + (row.picked ? " on" : "");
    return el;
  }
  const el = document.createElement("div");
  el.className = "step";
  el.style.minWidth = "92px";
  el.style.justifyContent = "center";
  el.textContent = row.key ?? "INSERT";
  return el;
}

function buildCard(card, page) {
  const el = document.createElement("div");
  el.className = "card";
  el.dataset.title = card.title.toLowerCase();

  const head = document.createElement("div");
  head.className = "card-head";
  head.style.color = card.color;

  const dot = document.createElement("div");
  dot.className = "card-dot";

  const title = document.createElement("div");
  title.className = "card-title";
  title.textContent = card.title;

  const chev = document.createElement("div");
  chev.className = "card-chev";
  chev.textContent = "▾";

  head.append(dot, title, chev);
  head.onclick = () => el.classList.toggle("collapsed");

  const rows = document.createElement("div");
  rows.className = "rows";

  card.rows.forEach((row) => {
    const rowEl = document.createElement("div");
    rowEl.className = "row" + (row.on ? " on" : "") + (row.control.kind === "key" || row.control.kind === "dropdown" ? " wide" : "");
    rowEl.dataset.label = row.label.toLowerCase();

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = row.label;

    rowEl.append(label, control(row));
    rows.append(rowEl);
  });

  el.append(head, rows);
  return el;
}

function render(page) {
  current = page;
  const data = PAGES[page];
  const content = document.getElementById("content");
  content.innerHTML = "";
  data.cards.forEach((card) => content.append(buildCard(card, page)));
  document.getElementById("page-title").textContent = data.title;
  document.getElementById("footnote").textContent =
    page === "settings" ? "Клик по кнопке клавиши и нажми любую клавишу, чтобы сменить бинд." : "";
  applySearch();
  document.querySelectorAll(".nav").forEach((btn) => btn.classList.toggle("active", btn.dataset.page === page));
}

function applySearch() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  document.querySelectorAll(".card").forEach((card) => {
    const titleMatch = card.dataset.title.includes(q);
    let visibleRows = 0;
    card.querySelectorAll(".row").forEach((row) => {
      const show = q === "" || titleMatch || row.dataset.label.includes(q);
      row.style.display = show ? "" : "none";
      if (show) visibleRows++;
    });
    card.style.display = (q === "" || titleMatch || visibleRows > 0) ? "" : "none";
    if (q !== "") card.classList.remove("collapsed");
  });
}

document.querySelectorAll(".nav").forEach((btn) => {
  btn.onclick = () => render(btn.dataset.page);
});
document.getElementById("search").oninput = applySearch;

render("visual");
</script>
</body>
</html>
